<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>URL Keyword Crawler</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      width: 480px;
      font-family: 'Segoe UI', -apple-system, sans-serif;
      font-size: 13px;
      color: #333;
      background: #f5f5f5;
    }

    .header {
      background: #1a73e8;
      color: white;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .header h1 {
      font-size: 15px;
      font-weight: 600;
    }

    .main {
      padding: 14px 16px;
    }

    .field {
      margin-bottom: 10px;
    }

    label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      color: #555;
      margin-bottom: 4px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    input[type="text"],
    input[type="number"] {
      width: 100%;
      padding: 7px 10px;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 13px;
      background: white;
      transition: border-color 0.15s;
    }

    input[type="text"]:focus,
    input[type="number"]:focus {
      outline: none;
      border-color: #1a73e8;
    }

    .options-row {
      display: flex;
      gap: 10px;
    }

    .options-row .field {
      flex: 1;
    }

    .hint {
      font-size: 11px;
      color: #888;
      margin-top: 3px;
    }

    .btn-row {
      display: flex;
      gap: 8px;
      margin-top: 12px;
    }

    button {
      padding: 8px 16px;
      border: none;
      border-radius: 4px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s, opacity 0.15s;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    #btn-start {
      background: #1a73e8;
      color: white;
      flex: 1;
    }

    #btn-start:hover:not(:disabled) {
      background: #1557b0;
    }

    #btn-stop {
      background: #ea4335;
      color: white;
      display: none;
    }

    #btn-stop:hover:not(:disabled) {
      background: #c5221f;
    }

    .progress-area {
      margin-top: 12px;
      display: none;
    }

    .progress-bar-wrap {
      height: 4px;
      background: #e0e0e0;
      border-radius: 2px;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      background: #1a73e8;
      width: 0%;
      transition: width 0.3s;
    }

    .progress-text {
      font-size: 11px;
      color: #666;
      margin-top: 5px;
    }

    .results-area {
      margin-top: 12px;
    }

    .results-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 6px;
    }

    .results-count {
      font-size: 12px;
      font-weight: 600;
      color: #333;
    }

    .results-count span {
      color: #1a73e8;
    }

    #btn-copy {
      background: #34a853;
      color: white;
      font-size: 12px;
      padding: 5px 12px;
      display: none;
    }

    #btn-copy:hover:not(:disabled) {
      background: #1e8e3e;
    }

    #btn-copy.copied {
      background: #188038;
    }

    .url-list {
      max-height: 240px;
      overflow-y: auto;
      border: 1px solid #ddd;
      border-radius: 4px;
      background: white;
    }

    .url-item {
      padding: 6px 10px;
      border-bottom: 1px solid #f0f0f0;
      font-size: 11px;
      word-break: break-all;
      color: #1a73e8;
      line-height: 1.4;
    }

    .url-item:last-child {
      border-bottom: none;
    }

    .url-item:hover {
      background: #f8f9ff;
    }

    .empty-state {
      padding: 20px;
      text-align: center;
      color: #999;
      font-size: 12px;
    }

    .error-msg {
      background: #fce8e6;
      color: #c5221f;
      padding: 8px 10px;
      border-radius: 4px;
      font-size: 12px;
      margin-top: 8px;
      display: none;
    }

    .status-badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 10px;
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
    }

    .status-badge.running {
      background: #e8f0fe;
      color: #1a73e8;
    }

    .status-badge.done {
      background: #e6f4ea;
      color: #188038;
    }

    .status-badge.stopped {
      background: #fce8e6;
      color: #c5221f;
    }
  </style>
</head>
<body>
  <div class="header">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="white">
      <path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
    </svg>
    <h1>URL Keyword Crawler</h1>
  </div>

  <div class="main">
    <div class="field">
      <label>クロール開始URL</label>
      <input type="text" id="input-url" placeholder="https://www.env.go.jp/" />
    </div>

    <div class="field">
      <label>検索キーワード</label>
      <input type="text" id="input-keywords" placeholder="カーボンフットプリント 温室効果ガス" />
      <div class="hint">スペース区切りで複数指定可（例: カーボン フットプリント）</div>
    </div>

    <div class="options-row">
      <div class="field">
        <label>最大クロール数</label>
        <input type="number" id="input-max-pages" value="100" min="1" max="500" />
      </div>
      <div class="field">
        <label>最大深度</label>
        <input type="number" id="input-max-depth" value="3" min="1" max="5" />
      </div>
    </div>

    <div class="btn-row">
      <button id="btn-start">クロール開始</button>
      <button id="btn-stop">停止</button>
    </div>

    <div class="error-msg" id="error-msg"></div>

    <div class="progress-area" id="progress-area">
      <div class="progress-bar-wrap">
        <div class="progress-bar" id="progress-bar"></div>
      </div>
      <div class="progress-text" id="progress-text">初期化中...</div>
    </div>

    <div class="results-area" id="results-area" style="display:none">
      <div class="results-header">
        <div class="results-count">
          マッチしたURL: <span id="match-count">0</span>件
          &nbsp;<span class="status-badge" id="status-badge"></span>
        </div>
        <button id="btn-copy">全URLをコピー</button>
      </div>
      <div class="url-list" id="url-list">
        <div class="empty-state">該当するURLが見つかりませんでした</div>
      </div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
